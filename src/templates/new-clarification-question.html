<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tender Question</title>
    
</head>
<body style="font-family: sans-serif; margin: 20px; background-color: #f8fafc;">
    <div class="email-wrapper" style="max-width: 600px; margin: auto; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
        <div class="email-header" style="background-color: #ed8936; color: #ffffff; padding: 40px; text-align: center;">
            <h1 class="email-title" style="font-size: 28px; font-weight: 700;">❓ New Question on Tender</h1>
        </div>
        <div class="email-content" style="padding: 40px 30px;">
            <div class="greeting" style="font-size: 18px; font-weight: 600; margin-bottom: 24px;">Hello {{tenderManagerName}},</div>
            <p>A bidder has submitted a question regarding <strong>{{tenderTitle}}</strong>. Your response is required.</p>
            <div class="info-card" style="background-color: #fffaf0; border-left: 4px solid #ed8936; padding: 20px; margin: 24px 0; border-radius: 8px;">
                <h3>Question:</h3>
                <p>"{{question}}"</p>
            </div>
            <div style="text-align: center; margin: 32px 0;">
                <a href="{{clarificationLink}}" class="cta-button" style="display: inline-block; background-color: #ed8936; text-decoration: none; padding: 16px 32px; border-radius: 8px; font-weight: 600; color: #ffffff;">Answer Question</a>
            </div>
        </div>
        <div class="email-footer" style="text-align: center; padding: 30px; font-size: 13px; color: #6b7280;">
            <p>&copy; {{year}} Infrasoko. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
