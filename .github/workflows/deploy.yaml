name: Deploy InfraSoko Backend Services

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  # test:
  #   name: Run Tests
  #   runs-on: ubuntu-latest
  #   needs: build
  #
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: Set up Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: npm
  #
  #     - name: Install dependencies
  #       run: npm ci
  #
  #     - name: Run tests
  #       run: npm run test:ci

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy and restart PM2 (with rollback)
        uses: appleboy/ssh-action@v0.1.6
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          script: |
            set -e  # stop script if any command fails
            cd ${{ secrets.PROJECT_PATH }}

            APP_NAME="infrasoko-backend"

            echo "Saving current commit hash..."
            git rev-parse HEAD > .last_successful_commit

            echo "Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh

            echo "Installing production dependencies..."
            npm ci

            echo "Ensuring PM2 process exists and is running ($APP_NAME)..."
            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              echo "PM2 process exists. Restarting..."
              if ! pm2 restart "$APP_NAME"; then
                echo "PM2 restart failed! Rolling back..."
                git reset --hard $(cat .last_successful_commit)
                npm ci
                npm run build
                pm2 restart "$APP_NAME"
                pm2 save
                echo "Rolled back to previous working version."
                exit 1
              fi
            else
              echo "PM2 process not found. Creating..."
              pm2 start dist/app.js --name "$APP_NAME"
            fi

            echo "Deployment successful. Saving PM2 state..."
            pm2 save
            git rev-parse HEAD > .last_successful_commit
